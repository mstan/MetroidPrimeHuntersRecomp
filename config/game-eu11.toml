[game]
name = "Metroid Prime Hunters"
id = "AMHP"
region = "Europe"
revision = 1
status = "EU1.1 bootstrap: ROM-header main banks with interpreter fallback"
rom = "Metroid Prime Hunters (Europe Rev 1).nds"
rom_size = 0x04000000
sha1 = "bdcd1dea293e24c98d4c481430e90d21198985a5"

[display]
screen_layout = "separate"
supersampling = 1
antialiasing = 0
# melonPrimeDS and mphCodex identify the revision-specific projection,
# 3D-to-2D projection and Q12 culling-aspect locations for every retail MPH
# revision. The runner applies those writes only after authoritative executable
# checksum validation, so EU1.1 can expose the same 21:9 feature as US1.0.
adaptive_widescreen = "top"
adaptive_capability = "top"
adaptive_width = 448
adaptive_skybox_fill = false
adaptive_hud_anchor = true
adaptive_hud_center_width = 128

[system]
startup_mode = "automatic"

[cartridge]
# Metroid Prime Hunters uses the same 256 KiB flash save geometry across the
# retail revisions tracked by the project. Keep this game-owned rather than a
# shared-runner default.
save_type = "flash"
save_size = 262144
