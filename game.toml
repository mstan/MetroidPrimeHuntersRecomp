[game]
name = "Metroid Prime Hunters"
id = "AMHE"
region = "USA"
revision = 0
status = "ROM-gated main banks enter Celestial Archives gameplay with interpreter fallback"
rom = "Metroid Prime Hunters.nds"
rom_size = 0x04000000
sha1 = "90164d1ac127ee5f9815ea4ae7de798c7b5fc629"
sha256 = "7d0a98ff98e1b7c985d1f3d89b01730af1b2115061a4dfea847612d217a8b855"

[display]
# Prime Hunters uses both screens heavily. Keep them independently presentable
# from the beginning, matching the established SM64DS host layout.
screen_layout = "separate"
supersampling = 1
antialiasing = 0

# The shared host-side adaptive renderer expands only the upper 3D viewport to
# 21:9. The lower touchscreen remains native 256x192 and independently
# clickable. The exact game SHA-1 above gates this title-owned capability.
adaptive_widescreen = "top"
adaptive_capability = "top"
adaptive_width = 448
# SM64DS needs a cylindrical-sky repair heuristic. Prime Hunters does not opt
# into that title-specific treatment; uncovered geometry remains visible
# during the MPH projection/culling audit.
adaptive_skybox_fill = false
# Gameplay enables three transparent text-tile planes for the visor and HUD.
# Anchor their authored left/center/right bands over the widened 3D world
# instead of falling back to a pillarboxed native composite.
adaptive_hud_anchor = true
# MPH's centered location banner and energy assembly are wider than the
# framework's conservative 64-pixel default. Preserve source X=64..191 as one
# centered unit so text and bars never cross an anchor seam.
adaptive_hud_center_width = 128
# Low-polygon tutorial/cinematic prompt frames can expose unaudited projection
# edges in the widened 3D surface. Center those simple frames while preserving
# adaptive widescreen during normal gameplay.
adaptive_center_max_polygons = 64
# Adventure mode computes per-room sub-frusta, portal screen bboxes, and
# entity sphere culling from native 4:3 constants, which hard-clips adjacent
# rooms at the native viewport edge and culls entities inside the widened
# band. This arms the title-owned guest patches that rebuild those frusta at
# the adaptive width; the runner activates them per frame only while the
# adventure overlay's guarded words are resident, so multiplayer and menus
# keep native behavior.
adaptive_guest_culling = true

[system]
# Exercise the authentic BIOS/firmware/card path and automatically launch the
# inserted cartridge after the normal firmware sequence.
startup_mode = "automatic"

[network.wfc]
# Guest CRT errno word (AMHE USA rev0 ARM9 static binary), zeroed by the
# runner on every AP association. Fixes error 52200 on the second and later
# Nintendo WFC connects within one launch: the DWC connection-test thread
# checks errno == ERANGE after atoi() without clearing errno, and modern
# WFC services send login numbers that overflow the guest's 32-bit strtol,
# leaving errno = ERANGE for the rest of the boot (beads-lqa.8). Inert
# unless networking is enabled at launch.
clear_crt_errno_addr = 0x021021EC

[cartridge]
# melonDS ROMList entry AMHE: SaveMemType 5 (256 KiB flash).
save_type = "flash"
save_size = 262144

[arm9]
rom_offset = 0x00004000
entry_pc = 0x02004800
load_address = 0x02004000
compressed_size = 0x0007e6c4
decompressed_size = 0x000dd9d8
overlay_count = 18

[arm7]
rom_offset = 0x0013aa00
entry_pc = 0x02380000
load_address = 0x02380000
size = 0x00028464

[framework]
path = "../ndsrecomp"
pin = "3126dcfb6f96109d9e5b205b4eea15f326891983"
branch = "main"

[reference.mphread]
url = "https://github.com/NoneGiven/MphRead.git"
pin = "26cd8a6fe93dc5e525d1a1bb304fe96001111e55"
license = "MIT"
use = "AMHE0-aware gameplay, save, room/entity, model, animation, collision, audio, and file-format research"
